<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F7FA">
    <meta name="description" content="Clank — Elegant task management">
    <title>Clank</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>Clank</h1>
        <div class="controls">
            <select id="project-filter">
                <option value="">All Projects</option>
            </select>
            <button id="new-project-btn">+ Project</button>
            <button id="new-task-btn">+ Task</button>
        </div>
    </header>

    <nav class="mobile-tabs" id="mobile-tabs">
        <button class="tab-btn active" data-column="backlog">Backlog</button>
        <button class="tab-btn" data-column="todo">To Do</button>
        <button class="tab-btn" data-column="in_progress">In Progress</button>
        <button class="tab-btn" data-column="done">Done</button>
    </nav>

    <main class="kanban">
        <div class="column active" data-status="backlog">
            <h2>Backlog</h2>
            <div class="tasks" id="backlog"></div>
        </div>
        <div class="column" data-status="todo">
            <h2>To Do</h2>
            <div class="tasks" id="todo"></div>
        </div>
        <div class="column" data-status="in_progress">
            <h2>In Progress</h2>
            <div class="tasks" id="in_progress"></div>
        </div>
        <div class="column" data-status="done">
            <h2>Done</h2>
            <div class="tasks" id="done"></div>
        </div>
    </main>

    <!-- Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Task Details</h2>
            <div id="parent-task-nav" class="parent-nav">
                <button type="button" id="back-to-parent-btn" class="back-btn">&larr; Back to parent task</button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required>
                </div>
                <div class="form-group">
                    <label for="task-project">Project</label>
                    <select id="task-project" required></select>
                </div>
                <div class="form-group">
                    <label for="task-description">
                        Description
                        <button type="button" id="expand-desc-btn" class="icon-btn" title="Expand">⤢</button>
                    </label>
                    <textarea id="task-description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="task-spec">
                        Spec (Markdown)
                        <button type="button" id="expand-spec-btn" class="icon-btn" title="Expand">⤢</button>
                    </label>
                    <textarea id="task-spec" rows="6"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit">Save</button>
                    <button type="button" id="delete-task-btn" class="danger">Delete</button>
                </div>
            </form>
            <div id="subtasks-section">
                <h3>Subtasks</h3>
                <ul id="subtasks-list"></ul>
                <div class="subtask-input-row">
                    <input type="text" id="subtask-title-input" placeholder="Add a subtask..." class="subtask-input">
                    <button type="button" id="add-subtask-btn" class="secondary">Add</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>New Project</h2>
            <form id="project-form">
                <div class="form-group">
                    <label for="project-name">Name</label>
                    <input type="text" id="project-name" required>
                </div>
                <div class="form-group">
                    <label for="project-description">Description</label>
                    <textarea id="project-description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Fullscreen Description Editor -->
    <div id="desc-fullscreen" class="fullscreen-editor">
        <div class="fullscreen-header">
            <h2>Description</h2>
            <div class="fullscreen-actions">
                <div class="toggle-group">
                    <button type="button" class="toggle-btn active" data-mode="edit">Edit</button>
                    <button type="button" class="toggle-btn" data-mode="view">View</button>
                </div>
                <button type="button" id="collapse-desc-btn" class="icon-btn" title="Collapse">⤡</button>
            </div>
        </div>
        <textarea class="fullscreen-textarea"></textarea>
        <div class="fullscreen-preview markdown-body"></div>
    </div>

    <!-- Fullscreen Spec Editor -->
    <div id="spec-fullscreen" class="fullscreen-editor">
        <div class="fullscreen-header">
            <h2>Spec (Markdown)</h2>
            <div class="fullscreen-actions">
                <div class="toggle-group">
                    <button type="button" class="toggle-btn active" data-mode="edit">Edit</button>
                    <button type="button" class="toggle-btn" data-mode="view">View</button>
                </div>
                <button type="button" id="collapse-spec-btn" class="icon-btn" title="Collapse">⤡</button>
            </div>
        </div>
        <textarea class="fullscreen-textarea"></textarea>
        <div class="fullscreen-preview markdown-body"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
