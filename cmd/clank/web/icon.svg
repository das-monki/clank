<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8EC"/>
      <stop offset="100%" style="stop-color:#FFE8D6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A80"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Lightning bolt / checkmark hybrid -->
  <path d="M280 96 L200 240 L260 240 L232 416 L360 220 L290 220 L340 96 Z"
        fill="url(#accent)"
        stroke="#E85A50"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Small decorative elements -->
  <circle cx="140" cy="160" r="16" fill="#FFB347" opacity="0.8"/>
  <circle cx="400" cy="380" r="12" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="120" cy="360" r="10" fill="#7BC67B" opacity="0.8"/>
</svg>
